<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Outline Runner</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #111214;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        touch-action: none;
      }
      #gameContainer {
        position: relative;
        width: min(100%, 1200px);
        max-width: 1200px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
        width: 100vw;
        max-width: 500px;
        height: 100vh;
        object-fit: contain;
        image-rendering: auto;
        touch-action: none;
      }
      .text {
        display: none;
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e5e7eb;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        text-align: center;
        white-space: nowrap;
        line-height: 1.5;
        z-index: 10;
      }
      #startText,
      #gameOverText {
        color: #d4af37;
        top: 27%;
      }
      .game-ui {
        position: absolute;
        inset: 1rem;
        z-index: 20;
        pointer-events: none;
      }
      .game-button,
      .modal button {
        border: 1px solid #d4af37;
        border-radius: 4px;
        background: #17181c;
        color: #f3f4f6;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 0.65rem 0.85rem;
      }
      .game-button:hover,
      .modal button:hover {
        background: #d4af37;
        color: #111214;
      }
      #leaderboardButton {
        pointer-events: auto;
        position: absolute;
        right: 0;
        top: 0;
      }
      #coinCounter {
        background: rgba(23, 24, 28, 0.88);
        border: 1px solid #d4af37;
        color: #f3f4f6;
        font-size: 13px;
        font-weight: 700;
        left: 0;
        padding: 0.65rem 0.85rem;
        position: absolute;
        top: 0;
      }
      #gameOverActions {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-top: 0.75rem;
        pointer-events: auto;
      }
      .modal {
        align-items: center;
        background: rgba(0, 0, 0, 0.78);
        display: none;
        inset: 0;
        justify-content: center;
        padding: 1rem;
        pointer-events: auto;
        position: absolute;
        z-index: 30;
      }
      .modal.is-open {
        display: flex;
      }
      .modal-panel {
        background: #17181c;
        border: 1px solid #4b4d55;
        border-radius: 6px;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.5);
        color: #f3f4f6;
        max-width: 22rem;
        padding: 1.25rem;
        width: 100%;
      }
      .modal h2 {
        color: #d4af37;
        font-size: 1.1rem;
        margin: 0 0 1rem;
      }
      .modal form {
        display: grid;
        gap: 0.75rem;
      }
      .modal label {
        display: grid;
        font-size: 0.8rem;
        gap: 0.35rem;
      }
      .modal input {
        background: #0e0f11;
        border: 1px solid #4b4d55;
        border-radius: 3px;
        color: #fff;
        font: inherit;
        padding: 0.6rem;
      }
      .modal input:focus {
        border-color: #d4af37;
        outline: 2px solid rgba(212, 175, 55, 0.25);
      }
      .modal-error {
        color: #f78b8b;
        font-size: 0.8rem;
        min-height: 1.2em;
      }
      .modal-footer {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1rem;
      }
      .modal table {
        border-collapse: collapse;
        margin-bottom: 0.5rem;
        width: 100%;
      }
      .modal th,
      .modal td {
        border-bottom: 1px solid #303238;
        padding: 0.55rem 0.25rem;
        text-align: left;
      }
      .modal th:last-child,
      .modal td:last-child {
        text-align: right;
      }
      .loading {
        color: #b4b6bd;
        text-align: center;
      }
      @media (max-width: 500px) {
        .text {
          font-size: 20px;
        }
        .text span {
          font-size: 12px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <div id="startText" class="text" style="display: block">
        OUTLINE RUNNER<br /><span style="font-size: 14px; font-weight: 400"
          >Tilt Phone to Move<br />Touch to Jump</span
        >
      </div>
      <div id="gameOverText" class="text">
        GAME OVER<br /><span
          id="finalScore"
          style="font-size: 18px; font-weight: 400"
        ></span
        ><br /><span style="font-size: 14px; font-weight: 400">Tap or wait 3s to Restart</span>
        <div id="gameOverActions">
          <button id="saveHighscoreButton" class="game-button" type="button">Save Highscore</button>
          <button id="gameOverLeaderboardButton" class="game-button" type="button">View Leaderboard</button>
        </div>
      </div>
      <div class="game-ui">
        <div id="coinCounter" aria-live="polite">Coins: 0</div>
        <button id="leaderboardButton" class="game-button" type="button">View Leaderboard</button>
      </div>
      <div id="authModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <div class="modal-panel">
          <h2 id="authTitle">Save Highscore</h2>
          <form id="authForm">
            <label>Username <input id="usernameInput" name="username" required autocomplete="username" /></label>
            <label>Password <input id="passwordInput" name="password" required type="password" autocomplete="current-password" /></label>
            <div id="authError" class="modal-error" role="alert"></div>
            <div class="modal-footer">
              <button id="authCancelButton" type="button">Cancel</button>
              <button type="submit">Submit Score</button>
            </div>
          </form>
        </div>
      </div>
      <div id="leaderboardModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
        <div class="modal-panel">
          <h2 id="leaderboardTitle">Leaderboard</h2>
          <table>
            <thead><tr><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
            <tbody id="leaderboardList"><tr><td colspan="2" class="loading">Loading...</td></tr></tbody>
          </table>
          <div id="leaderboardError" class="modal-error" role="alert"></div>
          <div class="modal-footer"><button id="leaderboardCloseButton" type="button">Close</button></div>
        </div>
      </div>
      <canvas id="gameCanvas" width="320" height="600"></canvas>
    </div>
    <script>
      const c = document.getElementById("gameCanvas"),
        ctx = c.getContext("2d", { alpha: !1, desynchronized: !0 }),
        startText = document.getElementById("startText"),
        gameOverText = document.getElementById("gameOverText"),
        finalScore = document.getElementById("finalScore"),
        saveHighscoreButton = document.getElementById("saveHighscoreButton"),
        leaderboardButton = document.getElementById("leaderboardButton"),
        gameOverLeaderboardButton = document.getElementById("gameOverLeaderboardButton"),
        coinCounter = document.getElementById("coinCounter"),
        authModal = document.getElementById("authModal"),
        authForm = document.getElementById("authForm"),
        usernameInput = document.getElementById("usernameInput"),
        passwordInput = document.getElementById("passwordInput"),
        authError = document.getElementById("authError"),
        leaderboardModal = document.getElementById("leaderboardModal"),
        leaderboardList = document.getElementById("leaderboardList"),
        leaderboardError = document.getElementById("leaderboardError"),
        frameTime = 1e3 / 60,
        gameTimeScale = 1,
        camera = { x: 0, y: 250, z: -200, fov: 500 };
      let score = 0,
        highscore = Number(localStorage.getItem("geometryRunnerHighscore")) || 0,
        totalCoins = Number(localStorage.getItem("geometryRunnerTotalCoins")) || 0,
        gameSpeed = 20,
        runTime = 0,
        sessionCoins = 0,
        coinSpawnTimer = 0,
        isGameOver = !1,
        obstacles = [],
        coins = [],
        particles = [],
        nextTimer = 0,
        hasStarted = !1,
        restartTimeout = null,
        isPageVisible = "visible" === document.visibilityState,
        lastFrameTime = 0,
        frameScale = 1,
        gridZ = [];
      coinCounter.textContent = `Coins: ${totalCoins}`;
      const keys = { left: !1, right: !1 },
        playerSpeed = 8;
      let phoneTilt = 0,
        renderQueue = [];
      window.addEventListener("deviceorientation", (e) => {
        "number" == typeof e.gamma &&
          (phoneTilt = Math.max(-1, Math.min(1, e.gamma / 30)));
      });
      for (let e = -200; e <= 5e3; e += 200) gridZ.push(e);
      function project(e, t, a) {
        let r = a - camera.z;
        r < 1 && (r = 1);
        let i = camera.fov / r;
        return {
          x: 160 + (e - camera.x) * i,
          y: 220 - (t - camera.y) * i,
          s: i,
        };
      }
      function multMat(e, t) {
        return [
          e[0] * t[0] + e[1] * t[3] + e[2] * t[6],
          e[0] * t[1] + e[1] * t[4] + e[2] * t[7],
          e[0] * t[2] + e[1] * t[5] + e[2] * t[8],
          e[3] * t[0] + e[4] * t[3] + e[5] * t[6],
          e[3] * t[1] + e[4] * t[4] + e[5] * t[7],
          e[3] * t[2] + e[4] * t[5] + e[5] * t[8],
          e[6] * t[0] + e[7] * t[3] + e[8] * t[6],
          e[6] * t[1] + e[7] * t[4] + e[8] * t[7],
          e[6] * t[2] + e[7] * t[5] + e[8] * t[8],
        ];
      }
      function getRotMat(e, t, a, r) {
        let i = Math.sqrt(e * e + t * t + a * a);
        i > 0 && ((e /= i), (t /= i), (a /= i));
        let s = Math.cos(r),
          l = Math.sin(r),
          o = 1 - s;
        return [
          o * e * e + s,
          o * e * t - l * a,
          o * e * a + l * t,
          o * e * t + l * a,
          o * t * t + s,
          o * t * a - l * e,
          o * e * a - l * t,
          o * t * a + l * e,
          o * a * a + s,
        ];
      }
      const boxFaces = [
          [1, 2, 3, 0],
          [4, 7, 6, 5],
          [1, 5, 6, 2],
          [4, 0, 3, 7],
          [2, 6, 7, 3],
          [0, 4, 5, 1],
        ],
        pyrFaces = [
          [0, 3, 2, 1],
          [1, 4, 0],
          [2, 4, 1],
          [3, 4, 2],
          [0, 4, 3],
        ],
        baseSphereRings = [[], [], []],
        segs = 32;
      for (let e = 0; e <= 32; e++) {
        let t = (e / 32) * Math.PI * 2;
        (baseSphereRings[0].push({ x: Math.cos(t), y: Math.sin(t), z: 0 }),
          baseSphereRings[1].push({ x: 0, y: Math.cos(t), z: Math.sin(t) }),
          baseSphereRings[2].push({ x: Math.cos(t), y: 0, z: Math.sin(t) }));
      }
      function pushBox(e, t, a, r, i, s, l, o) {
        renderQueue.push({
          type: "box",
          cx: e,
          cy: t,
          cz: a,
          w: r,
          h: i,
          d: s,
          rot: l,
          alpha: o,
        });
      }
      function pushPyramid(e, t, a, r, i, s, l, o = !1, h = "#c7cbd1") {
        renderQueue.push({
          type: "pyramid",
          cx: e,
          cy: t,
          cz: a,
          w: r,
          h: i,
          d: s,
          alpha: l,
          upsideDown: o,
          color: h,
        });
      }
      function pushSphere(e, t, a, r, i, s) {
        renderQueue.push({
          type: "sphere",
          cx: e,
          cy: t,
          cz: a,
          r: r,
          mat: i,
          alpha: s,
        });
      }
      function pushCoin(e, t, a, r, i, s) {
        renderQueue.push({
          type: "coin",
          cx: e,
          cy: t,
          cz: a,
          r,
          spin: i,
          alpha: s,
        });
      }
      function drawBox(e) {
        if (e.alpha <= 0.01) return;
        let t = e.w / 2,
          a = e.h / 2,
          r = e.d / 2,
          i = [
            { x: -t, y: -a, z: -r },
            { x: t, y: -a, z: -r },
            { x: t, y: a, z: -r },
            { x: -t, y: a, z: -r },
            { x: -t, y: -a, z: r },
            { x: t, y: -a, z: r },
            { x: t, y: a, z: r },
            { x: -t, y: a, z: r },
          ];
        if (0 !== e.rot) {
          let t = Math.cos(e.rot),
            a = Math.sin(e.rot);
          for (let e of i) {
            let r = e.x * t - e.y * a,
              i = e.x * a + e.y * t;
            ((e.x = r), (e.y = i));
          }
        }
        let s = i.map((t) => project(e.cx + t.x, e.cy + t.y, e.cz + t.z));
        ((ctx.fillStyle = "#151619"),
          (ctx.strokeStyle = `rgba(199,203,209,${e.alpha})`),
          (ctx.lineWidth = 2),
          (ctx.lineJoin = "round"));
        for (let e of boxFaces) {
          let t = s[e[0]],
            a = s[e[1]],
            r = s[e[2]];
          if ((a.x - t.x) * (r.y - a.y) - (a.y - t.y) * (r.x - a.x) < 0) {
            (ctx.beginPath(), ctx.moveTo(t.x, t.y));
            for (let t = 1; t < 4; t++) ctx.lineTo(s[e[t]].x, s[e[t]].y);
            (ctx.closePath(), ctx.fill(), ctx.stroke());
          }
        }
      }
      function drawPyramid(e) {
        if (e.alpha <= 0.01) return;
        let t = e.w / 2,
          a = e.h / 2,
          r = e.d / 2,
          i = e.upsideDown ? -1 : 1,
          s = [
            { x: -t, y: -a * i, z: -r },
            { x: t, y: -a * i, z: -r },
            { x: t, y: -a * i, z: r },
            { x: -t, y: -a * i, z: r },
            { x: 0, y: a * i, z: 0 },
          ].map((t) => project(e.cx + t.x, e.cy + t.y, e.cz + t.z));
        ((ctx.fillStyle = "#1b1c20"),
          (ctx.globalAlpha = e.alpha),
          (ctx.strokeStyle = e.color),
          (ctx.lineWidth = 2),
          (ctx.lineJoin = "round"));
        for (let t of pyrFaces) {
          let a = s[t[0]],
            r = s[t[1]],
            i = s[t[2]],
            l = (r.x - a.x) * (i.y - r.y) - (r.y - a.y) * (i.x - r.x);
          if (e.upsideDown ? l > 0 : l < 0) {
            (ctx.beginPath(), ctx.moveTo(a.x, a.y));
            for (let e = 1; e < t.length; e++) ctx.lineTo(s[t[e]].x, s[t[e]].y);
            (ctx.closePath(), ctx.fill(), ctx.stroke());
          }
        }
        ctx.globalAlpha = 1;
      }
      function drawSphere(e) {
        if (e.alpha <= 0.01) return;
        let t = project(e.cx, e.cy, e.cz);
        if (t.s <= 0) return;
        ((ctx.fillStyle = "#151619"),
          (ctx.strokeStyle = `rgba(224,226,230,${e.alpha})`),
          (ctx.lineWidth = 2),
          (ctx.lineJoin = "round"),
          (ctx.lineCap = "round"));
        let a = e.r * t.s;
        (ctx.beginPath(),
          ctx.arc(t.x, t.y, a, 0, 2 * Math.PI),
          ctx.fill(),
          ctx.stroke());
        let r = e.mat;
        for (let e of baseSphereRings) {
          ctx.beginPath();
          let i = !1;
          for (let s of e) {
            let e = s.x * r[0] + s.y * r[1] + s.z * r[2],
              l = s.x * r[3] + s.y * r[4] + s.z * r[5];
            if (s.x * r[6] + s.y * r[7] + s.z * r[8] <= 0.05) {
              let r = t.x + e * a,
                s = t.y - l * a;
              i ? ctx.lineTo(r, s) : (ctx.moveTo(r, s), (i = !0));
            } else i = !1;
          }
          ctx.stroke();
        }
      }
      function drawCoin(e) {
        if (e.alpha <= 0.01) return;
        const projected = project(e.cx, e.cy, e.cz);
        if (projected.s <= 0) return;
        const radius = e.r * projected.s;
        const width = Math.max(0.08, Math.abs(Math.cos(e.spin))) * radius;
        ctx.fillStyle = "#d4af37";
        ctx.strokeStyle = "#ffe28a";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(projected.x, projected.y, width, radius, 0, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
      }
      const storageKeys = {
        username: "geometryRunnerUsername",
        token: "geometryRunnerToken",
        highscore: "geometryRunnerHighscore",
      };
      function getSavedCredentials() {
        const username = localStorage.getItem(storageKeys.username);
        const token = localStorage.getItem(storageKeys.token);
        return username && token ? { username, token } : null;
      }
      async function postJson(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to save score.");
        return data;
      }
      async function submitScoreInBackground() {
        const credentials = getSavedCredentials();
        if (!credentials || score <= highscore) return;
        try {
          await postJson("/api/submit-score", {
            username: credentials.username,
            token: credentials.token,
            score,
            coins: totalCoins,
          });
          highscore = score;
          localStorage.setItem(storageKeys.highscore, String(highscore));
        } catch (error) {
          console.warn("Background highscore submission failed.", error);
        }
      }
      function openAuthModal() {
        restartTimeout && clearTimeout(restartTimeout);
        authError.textContent = "";
        authModal.classList.add("is-open");
        usernameInput.focus();
      }
      function closeAuthModal() {
        authModal.classList.remove("is-open");
        authForm.reset();
      }
      async function saveHighscore() {
        const credentials = getSavedCredentials();
        if (credentials) {
          if (score <= highscore) return;
          try {
            await postJson("/api/submit-score", {
              username: credentials.username,
              token: credentials.token,
              score,
              coins: totalCoins,
            });
            highscore = score;
            localStorage.setItem(storageKeys.highscore, String(highscore));
            finalScore.textContent = `Score: ${score} | Highscore: ${highscore}`;
          } catch (error) {
            openAuthModal();
            authError.textContent = error.message;
          }
          return;
        }
        openAuthModal();
      }
      async function loadLeaderboard() {
        leaderboardModal.classList.add("is-open");
        leaderboardError.textContent = "";
        leaderboardList.innerHTML = '<tr><td colspan="2" class="loading">Loading...</td></tr>';
        try {
          const response = await fetch("/api/leaderboard");
          if (!response.ok) throw new Error("Unable to load leaderboard.");
          const scores = await response.json();
          leaderboardList.replaceChildren();
          scores.slice(0, 10).forEach((entry) => {
            const row = document.createElement("tr");
            const username = document.createElement("td");
            const playerScore = document.createElement("td");
            username.textContent = entry.username;
            playerScore.textContent = entry.highscore;
            row.append(username, playerScore);
            leaderboardList.appendChild(row);
          });
          if (!leaderboardList.children.length) {
            leaderboardList.innerHTML = '<tr><td colspan="2" class="loading">No scores yet.</td></tr>';
          }
        } catch (error) {
          leaderboardList.replaceChildren();
          leaderboardError.textContent = error.message;
        }
      }
      function closeLeaderboard() {
        leaderboardModal.classList.remove("is-open");
      }
      saveHighscoreButton.addEventListener("click", saveHighscore);
      leaderboardButton.addEventListener("click", loadLeaderboard);
      gameOverLeaderboardButton.addEventListener("click", loadLeaderboard);
      document.getElementById("authCancelButton").addEventListener("click", closeAuthModal);
      document.getElementById("leaderboardCloseButton").addEventListener("click", closeLeaderboard);
      authModal.addEventListener("click", (event) => event.target === authModal && closeAuthModal());
      leaderboardModal.addEventListener("click", (event) => event.target === leaderboardModal && closeLeaderboard());
      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        authError.textContent = "";
        const submitButton = authForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          const data = await postJson("/api/auth-score", {
            username: usernameInput.value.trim(),
            password: passwordInput.value,
            score,
            coins: totalCoins,
          });
          localStorage.setItem(storageKeys.username, usernameInput.value.trim());
          localStorage.setItem(storageKeys.token, data.token);
          highscore = Number(data.highscore) || score;
          localStorage.setItem(storageKeys.highscore, String(highscore));
          const returnedCoins = data.coins ?? data.totalCoins;
          if (Number.isFinite(Number(returnedCoins))) {
            totalCoins = Number(returnedCoins);
            localStorage.setItem("geometryRunnerTotalCoins", String(totalCoins));
            coinCounter.textContent = `Coins: ${totalCoins}`;
          }
          finalScore.textContent = `Score: ${score} | Highscore: ${highscore}`;
          closeAuthModal();
        } catch (error) {
          authError.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeAuthModal();
          closeLeaderboard();
        }
      });
      function triggerGameOver() {
        isGameOver ||
          ((isGameOver = !0),
          (gameSpeed = 20),
          (runTime = 0),
          (coinSpawnTimer = 0),
          (player.visible = !1),
          (particles = Array.from({ length: 25 }, () => {
            let e = Math.random() * Math.PI * 2,
              t = 2 + 5 * Math.random();
            return {
              x: player.x,
              y: Math.max(player.y, -50),
              z: player.z,
              vx: Math.cos(e) * t,
              vy: 5 + 10 * Math.random(),
              vz: Math.sin(e) * t,
              mat: [1, 0, 0, 0, 1, 0, 0, 0, 1],
              vAx: Math.random() - 0.5,
              vAy: Math.random() - 0.5,
              vAz: Math.random() - 0.5,
              vAng: 0.2 * Math.random(),
              size: 4 + 4 * Math.random(),
              life: 40 + 20 * Math.random(),
            };
          })),
          submitScoreInBackground(),
