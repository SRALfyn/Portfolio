              !hasStarted || isGameOver ? startGame(!0) : player.jump());
          },
          { passive: !1 },
        ),
        document.addEventListener("visibilitychange", () => {
          ((isPageVisible = "visible" === document.visibilityState),
            isPageVisible &&
              ((lastFrameTime = 0), requestAnimationFrame(animate)));
        }),
        resetGame(),
        animate());
    </script>
  </body>
