<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Outline Runner</title>
    <style>
      :root {
        --theme-color: #d4af37;
        --theme-glow: rgba(212, 175, 55, 0.25);
      }
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0c;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        touch-action: none;
      }
      #gameContainer {
        position: relative;
        width: 100%;
        max-width: 500px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
        width: 100vw;
        max-width: 500px;
        height: 100vh;
        object-fit: contain;
        image-rendering: auto;
        touch-action: none;
      }
      .text {
        display: none;
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e5e7eb;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        text-align: center;
        white-space: nowrap;
        line-height: 1.5;
        z-index: 10;
      }
      #startText,
      #gameOverText {
        color: var(--theme-color);
        top: 27%;
      }
      .game-ui {
        position: absolute;
        inset: 1rem;
        z-index: 20;
        pointer-events: none;
      }
      .game-button,
      .modal button {
        border: 1px solid var(--theme-color);
        border-radius: 4px;
        background: #17181c;
        color: #f3f4f6;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 0.65rem 0.85rem;
        transition: background 0.2s, border-color 0.2s;
      }
      .game-button:hover,
      .modal button:hover {
        background: var(--theme-color);
        color: #111214;
      }
      #leaderboardButton {
        pointer-events: auto;
        position: absolute;
        right: 0;
        top: 0;
      }
      #orbCounter {
        background: rgba(23, 24, 28, 0.88);
        border: 1px solid var(--theme-color);
        color: #f3f4f6;
        font-size: 13px;
        font-weight: 700;
        left: 0;
        padding: 0.65rem 0.85rem;
        position: absolute;
        top: 0;
        transition: border-color 0.2s;
      }
      #gameOverActions {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-top: 0.75rem;
        pointer-events: auto;
      }
      .modal {
        align-items: center;
        background: rgba(0, 0, 0, 0.78);
        display: none;
        inset: 0;
        justify-content: center;
        padding: 1rem;
        pointer-events: auto;
        position: absolute;
        z-index: 30;
      }
      .modal.is-open {
        display: flex;
      }
      .modal-panel {
        background: #17181c;
        border: 1px solid #4b4d55;
        border-radius: 6px;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.5);
        color: #f3f4f6;
        max-width: 22rem;
        padding: 1.25rem;
        width: 100%;
      }
      .modal h2 {
        color: var(--theme-color);
        font-size: 1.1rem;
        margin: 0 0 1rem;
      }
      .modal form {
        display: grid;
        gap: 0.75rem;
      }
      .modal label {
        display: grid;
        font-size: 0.8rem;
        gap: 0.35rem;
      }
      .modal input {
        background: #0e0f11;
        border: 1px solid #4b4d55;
        border-radius: 3px;
        color: #fff;
        font: inherit;
        padding: 0.6rem;
        transition: outline 0.2s, border-color 0.2s;
      }
      .modal input:focus {
        border-color: var(--theme-color);
        outline: 2px solid var(--theme-glow);
      }
      .modal-error {
        color: #f78b8b;
        font-size: 0.8rem;
        min-height: 1.2em;
      }
      .modal-footer {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1rem;
      }
      .modal table {
        border-collapse: collapse;
        margin-bottom: 0.5rem;
        width: 100%;
      }
      .modal th,
      .modal td {
        border-bottom: 1px solid #303238;
        padding: 0.55rem 0.25rem;
        text-align: left;
      }
      .modal th:last-child,
      .modal td:last-child {
        text-align: right;
      }
      .loading {
        color: #b4b6bd;
        text-align: center;
      }
      @media (max-width: 500px) {
        .text {
          font-size: 20px;
        }
        .text span {
          font-size: 12px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <div id="startText" class="text" style="display: block">
        OUTLINE RUNNER<br /><span style="font-size: 14px; font-weight: 400"
          >Tilt Phone to Move<br />Touch to Jump</span
        >
      </div>
      <div id="gameOverText" class="text">
        GAME OVER<br /><span
          id="finalScore"
          style="font-size: 18px; font-weight: 400"
        ></span
        ><br /><span style="font-size: 14px; font-weight: 400">Tap or wait 3s to Restart</span>
        <div id="gameOverActions">
          <button id="saveHighscoreButton" class="game-button" type="button">Save Highscore</button>
          <button id="gameOverLeaderboardButton" class="game-button" type="button">View Leaderboard</button>
        </div>
      </div>
      <div class="game-ui">
        <div id="orbCounter" aria-live="polite">Orbs: 0</div>
        <button id="leaderboardButton" class="game-button" type="button">View Leaderboard</button>
      </div>
      <div id="authModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <div class="modal-panel">
          <h2 id="authTitle">Save Highscore</h2>
          <form id="authForm">
            <label>Username <input id="usernameInput" name="username" required autocomplete="username" /></label>
            <label>Password <input id="passwordInput" name="password" required type="password" autocomplete="current-password" /></label>
            <div id="authError" class="modal-error" role="alert"></div>
            <div class="modal-footer">
              <button id="authCancelButton" type="button">Cancel</button>
              <button type="submit">Submit Score</button>
            </div>
          </form>
        </div>
      </div>
      <div id="leaderboardModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
        <div class="modal-panel">
          <h2 id="leaderboardTitle">Leaderboard</h2>
          <table>
            <thead><tr><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
            <tbody id="leaderboardList"><tr><td colspan="2" class="loading">Loading...</td></tr></tbody>
          </table>
          <div id="leaderboardError" class="modal-error" role="alert"></div>
          <div class="modal-footer"><button id="leaderboardCloseButton" type="button">Close</button></div>
        </div>
      </div>
      <canvas id="gameCanvas" width="320" height="600"></canvas>
    </div>
    <script>
      const c = document.getElementById("gameCanvas"),
        ctx = c.getContext("2d", { alpha: !1, desynchronized: !0 }),
        startText = document.getElementById("startText"),
        gameOverText = document.getElementById("gameOverText"),
        finalScore = document.getElementById("finalScore"),
        saveHighscoreButton = document.getElementById("saveHighscoreButton"),
        leaderboardButton = document.getElementById("leaderboardButton"),
        gameOverLeaderboardButton = document.getElementById("gameOverLeaderboardButton"),
        orbCounter = document.getElementById("orbCounter"),
        authModal = document.getElementById("authModal"),
        authForm = document.getElementById("authForm"),
        usernameInput = document.getElementById("usernameInput"),
        passwordInput = document.getElementById("passwordInput"),
        authError = document.getElementById("authError"),
        leaderboardModal = document.getElementById("leaderboardModal"),
        leaderboardList = document.getElementById("leaderboardList"),
        leaderboardError = document.getElementById("leaderboardError"),
        frameTime = 1e3 / 60,
        gameTimeScale = 1,
        camera = { x: 0, y: 250, z: -200, fov: 500 };
      
      let baseHue = 45;
      let globalColorTime = 0; 
      let mountainZTracker = 0;
      
      let score = 0,
        highscore = Number(localStorage.getItem("geometryRunnerHighscore")) || 0,
        totalOrbs = Number(localStorage.getItem("geometryRunnerTotalCoins")) || 0,
        gameSpeed = 20,
        runTime = 0,
        globalDistance = 0,
        orbSpawnTimer = 0,
        isGameOver = !1,
        obstacles = [],
        orbs = [],
        particles = [],
        nextTimer = 0,
        hasStarted = !1,
        restartTimeout = null,
        isPageVisible = "visible" === document.visibilityState,
        lastFrameTime = 0,
        frameScale = 1,
        gridZ = [];
        
      const stars = Array.from({ length: 45 }, () => ({
        x: Math.random() * 2, 
        y: Math.random(), 
        twinkleOffset: Math.random() * Math.PI * 2
      }));

      orbCounter.textContent = `Orbs: 0`;
      const keys = { left: !1, right: !1 },
        playerSpeed = 8;
      let phoneTilt = 0,
        renderQueue = [];
      window.addEventListener("deviceorientation", (e) => {
        "number" == typeof e.gamma &&
          (phoneTilt = Math.max(-1, Math.min(1, e.gamma / 30)));
      });
      for (let e = -200; e <= 8000; e += 200) gridZ.push(e);
      
      function project(e, t, a) {
        let r = a - camera.z;
        r < 1 && (r = 1);
        let i = camera.fov / r;
        let curve = (Math.sin(globalDistance * 0.00005) + Math.sin(globalDistance * 0.00002) * 0.5) * 0.00002;
        let dx = (r * r) * curve;
        return {
          x: 160 + (e - camera.x + dx) * i,
          y: 220 - (t - camera.y) * i,
          s: i,
        };
      }
      
      function multMat(e, t) {
        return [
          e[0] * t[0] + e[1] * t[3] + e[2] * t[6],
          e[0] * t[1] + e[1] * t[4] + e[2] * t[7],
          e[0] * t[2] + e[1] * t[5] + e[2] * t[8],
          e[3] * t[0] + e[4] * t[3] + e[5] * t[6],
          e[3] * t[1] + e[4] * t[4] + e[5] * t[7],
          e[3] * t[2] + e[4] * t[5] + e[5] * t[8],
          e[6] * t[0] + e[7] * t[3] + e[8] * t[6],
          e[6] * t[1] + e[7] * t[4] + e[8] * t[7],
          e[6] * t[2] + e[7] * t[5] + e[8] * t[8],
        ];
      }
      
      function getRotMat(e, t, a, r) {
        let i = Math.sqrt(e * e + t * t + a * a);
        i > 0 && ((e /= i), (t /= i), (a /= i));
        let s = Math.cos(r),
          l = Math.sin(r),
          o = 1 - s;
        return [
          o * e * e + s,
          o * e * t - l * a,
          o * e * a + l * t,
          o * e * t + l * a,
          o * t * t + s,
          o * t * a - l * e,
          o * e * a - l * t,
          o * t * a + l * e,
          o * a * a + s,
        ];
      }
      
      const boxFaces = [[1, 2, 3, 0], [4, 7, 6, 5], [1, 5, 6, 2], [4, 0, 3, 7], [2, 6, 7, 3], [0, 4, 5, 1]],
        pyrFaces = [[0, 3, 2, 1], [1, 4, 0], [2, 4, 1], [3, 4, 2], [0, 4, 3]],
        baseSphereRings = [[], [], []],
        segs = 32;
        
      for (let e = 0; e <= 32; e++) {
        let t = (e / 32) * Math.PI * 2;
        (baseSphereRings[0].push({ x: Math.cos(t), y: Math.sin(t), z: 0 }),
          baseSphereRings[1].push({ x: 0, y: Math.cos(t), z: Math.sin(t) }),
          baseSphereRings[2].push({ x: Math.cos(t), y: 0, z: Math.sin(t) }));
      }
      
      function pushBox(e, t, a, r, i, s, l, o) {
        renderQueue.push({ type: "box", cx: e, cy: t, cz: a, w: r, h: i, d: s, rot: l, alpha: o });
      }
      function pushPyramid(e, t, a, r, i, s, l, o = !1, h = "#c7cbd1") {
        renderQueue.push({ type: "pyramid", cx: e, cy: t, cz: a, w: r, h: i, d: s, alpha: l, upsideDown: o, color: h });
      }
      function pushSphere(e, t, a, r, i, s) {
        renderQueue.push({ type: "sphere", cx: e, cy: t, cz: a, r: r, mat: i, alpha: s });
      }
      function pushOrb(e, t, a, r, i, s) {
        renderQueue.push({ type: "orb", cx: e, cy: t, cz: a, r: r, spin: i, alpha: s });
      }
      
      function drawBox(e) {
        if (e.alpha <= 0.01) return;
        let t = e.w / 2, a = e.h / 2, r = e.d / 2, i = [
            { x: -t, y: -a, z: -r }, { x: t, y: -a, z: -r }, { x: t, y: a, z: -r }, { x: -t, y: a, z: -r },
            { x: -t, y: -a, z: r }, { x: t, y: -a, z: r }, { x: t, y: a, z: r }, { x: -t, y: a, z: r }
          ];
        if (0 !== e.rot) {
          let t = Math.cos(e.rot), a = Math.sin(e.rot);
          for (let e of i) {
            let r = e.x * t - e.y * a, i = e.x * a + e.y * t;
            ((e.x = r), (e.y = i));
          }
        }
        let s = i.map((t) => project(e.cx + t.x, e.cy + t.y, e.cz + t.z));
        ctx.strokeStyle = `hsla(${baseHue}, 20%, 70%, ${e.alpha})`;
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        for (let e of boxFaces) {
          let t = s[e[0]], a = s[e[1]], r = s[e[2]];
          if ((a.x - t.x) * (r.y - a.y) - (a.y - t.y) * (r.x - a.x) < 0) {
            ctx.beginPath();
            ctx.moveTo(t.x, t.y);
            for (let t = 1; t < 4; t++) ctx.lineTo(s[e[t]].x, s[e[t]].y);
            ctx.closePath();
            ctx.fillStyle = `rgba(10, 10, 12, ${e.alpha})`;
            ctx.fill();
            ctx.stroke();
          }
        }
      }
      
      function drawPyramid(e) {
        if (e.alpha <= 0.01) return;
        let t = e.w / 2, a = e.h / 2, r = e.d / 2, i = e.upsideDown ? -1 : 1, s = [
            { x: -t, y: -a * i, z: -r }, { x: t, y: -a * i, z: -r }, { x: t, y: -a * i, z: r },
            { x: -t, y: -a * i, z: r }, { x: 0, y: a * i, z: 0 }
          ].map((t) => project(e.cx + t.x, e.cy + t.y, e.cz + t.z));
        let colorStr = e.upsideDown ? `hsla(${baseHue}, 80%, 60%, ${e.alpha})` : `hsla(${baseHue}, 10%, 65%, ${e.alpha})`;
        ctx.strokeStyle = colorStr;
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        for (let t of pyrFaces) {
          let a = s[t[0]], r = s[t[1]], i = s[t[2]], l = (r.x - a.x) * (i.y - r.y) - (r.y - a.y) * (i.x - r.x);
          if (e.upsideDown ? l > 0 : l < 0) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            for (let e = 1; e < t.length; e++) ctx.lineTo(s[t[e]].x, s[t[e]].y);
            ctx.closePath();
            ctx.fillStyle = `rgba(10, 10, 12, ${e.alpha})`;
            ctx.fill();
            ctx.stroke();
          }
        }
      }
      
      function drawSphere(e) {
        if (e.alpha <= 0.01) return;
        let t = project(e.cx, e.cy, e.cz);
        if (t.s <= 0) return;
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        let a = e.r * t.s;
        
        ctx.beginPath();
        ctx.arc(t.x, t.y, a, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(10, 10, 12, ${e.alpha})`;
        ctx.fill();
        ctx.strokeStyle = `hsla(${baseHue}, 20%, 85%, ${e.alpha})`;
        ctx.stroke();
        
        let r = e.mat;
        for (let e of baseSphereRings) {
          ctx.beginPath();
          let i = !1;
          for (let s of e) {
            let e = s.x * r[0] + s.y * r[1] + s.z * r[2], l = s.x * r[3] + s.y * r[4] + s.z * r[5];
            if (s.x * r[6] + s.y * r[7] + s.z * r[8] <= 0.05) {
              let r = t.x + e * a, s = t.y - l * a;
              i ? ctx.lineTo(r, s) : (ctx.moveTo(r, s), (i = !0));
            } else i = !1;
          }
          ctx.stroke();
        }
      }

      function drawOrb(e) {
        if (e.alpha <= 0.01) return;
        let p = project(e.cx, e.cy, e.cz);
        if (p.s <= 0) return;
        let radius = e.r * p.s;
        let width = Math.max(0.08, Math.abs(Math.cos(e.spin))) * radius;
        ctx.globalAlpha = e.alpha;
        ctx.fillStyle = `hsl(${baseHue}, 100%, 77%)`;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, width, radius, 0, 0, 2 * Math.PI);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      
      const storageKeys = {
        username: "geometryRunnerUsername",
        token: "geometryRunnerToken",
        highscore: "geometryRunnerHighscore",
      };
      
      function getSavedCredentials() {
        const username = localStorage.getItem(storageKeys.username);
        const token = localStorage.getItem(storageKeys.token);
        return username && token ? { username, token } : null;
      }
      
      async function postJson(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to save score.");
        return data;
      }
      
      async function submitScoreInBackground() {
        const credentials = getSavedCredentials();
        if (!credentials || score <= highscore) return;
        try {
          await postJson("/api/submit-score", {
            username: credentials.username,
            token: credentials.token,
            score,
            coins: totalOrbs,
          });
          highscore = score;
          localStorage.setItem(storageKeys.highscore, String(highscore));
        } catch (error) {
          console.warn("Background highscore submission failed.", error);
        }
      }
      
      function openAuthModal() {
        restartTimeout && clearTimeout(restartTimeout);
        authError.textContent = "";
        authModal.classList.add("is-open");
        usernameInput.focus();
      }
      function closeAuthModal() {
        authModal.classList.remove("is-open");
        authForm.reset();
      }
      
      async function saveHighscore() {
        const credentials = getSavedCredentials();
        if (credentials) {
          if (score <= highscore) return;
          try {
            await postJson("/api/submit-score", {
              username: credentials.username,
              token: credentials.token,
              score,
              coins: totalOrbs,
            });
            highscore = score;
            localStorage.setItem(storageKeys.highscore, String(highscore));
            finalScore.textContent = `Score: ${score} | Highscore: ${highscore}`;
          } catch (error) {
            openAuthModal();
            authError.textContent = error.message;
          }
          return;
        }
        openAuthModal();
      }
      
      async function loadLeaderboard() {
        leaderboardModal.classList.add("is-open");
        leaderboardError.textContent = "";
        leaderboardList.innerHTML = '<tr><td colspan="2" class="loading">Loading...</td></tr>';
        try {
          const response = await fetch("/api/leaderboard");
          if (!response.ok) throw new Error("Unable to load leaderboard.");
          const scores = await response.json();
          leaderboardList.replaceChildren();
          scores.slice(0, 10).forEach((entry) => {
            const row = document.createElement("tr");
            const username = document.createElement("td");
            const playerScore = document.createElement("td");
            username.textContent = entry.username;
            playerScore.textContent = entry.highscore;
            row.append(username, playerScore);
            leaderboardList.appendChild(row);
          });
          if (!leaderboardList.children.length) {
            leaderboardList.innerHTML = '<tr><td colspan="2" class="loading">No scores yet.</td></tr>';
          }
        } catch (error) {
          leaderboardList.replaceChildren();
          leaderboardError.textContent = error.message;
        }
      }
      
      function closeLeaderboard() {
        leaderboardModal.classList.remove("is-open");
      }
      
      saveHighscoreButton.addEventListener("click", saveHighscore);
      leaderboardButton.addEventListener("click", loadLeaderboard);
      gameOverLeaderboardButton.addEventListener("click", loadLeaderboard);
      document.getElementById("authCancelButton").addEventListener("click", closeAuthModal);
      document.getElementById("leaderboardCloseButton").addEventListener("click", closeLeaderboard);
      authModal.addEventListener("click", (event) => event.target === authModal && closeAuthModal());
      leaderboardModal.addEventListener("click", (event) => event.target === leaderboardModal && closeLeaderboard());
      
      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        authError.textContent = "";
        const submitButton = authForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          const data = await postJson("/api/auth-score", {
            username: usernameInput.value.trim(),
            password: passwordInput.value,
            score,
            coins: totalOrbs,
          });
          localStorage.setItem(storageKeys.username, usernameInput.value.trim());
          localStorage.setItem(storageKeys.token, data.token);
          highscore = Number(data.highscore) || score;
          localStorage.setItem(storageKeys.highscore, String(highscore));
          const returnedCoins = data.coins ?? data.totalCoins;
          if (Number.isFinite(Number(returnedCoins))) {
            totalOrbs = Number(returnedCoins);
            localStorage.setItem("geometryRunnerTotalCoins", String(totalOrbs));
          }
          finalScore.textContent = `Score: ${score} | Highscore: ${highscore}`;
          closeAuthModal();
        } catch (error) {
          authError.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
      
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeAuthModal();
          closeLeaderboard();
        }
      });
      
      const player = {
        x: 0,
        y: 15,
        z: 200,
        r: 15,
        baseRadius: 15,
        maxJumpHeight: 0,
        mat: [1, 0, 0, 0, 1, 0, 0, 0, 1],
        baseY: 15,
        vy: 0,
        gravity: 1.2,
        jumpStrength: 20,
        fallGravity: 0.45,
        fallForwardRatio: 1,
        fallTime: 0,
        fallDirection: 0,
        jumping: !1,
        visible: !0,
        falling: !1,
        draw() {
          this.visible && pushSphere(this.x, this.y, this.z, this.r, this.mat, 1);
        },
        update() {
          if (!this.visible) return;
          this.r += (this.baseRadius - this.r) * Math.min(1, 0.35 * frameScale);
          let e = this.x;
          if (this.falling)
            ((this.x += 8 * this.fallDirection * 0.75 * frameScale),
              (this.y += this.vy * frameScale),
              (this.vy -= this.fallGravity * frameScale),
              (this.z -= gameSpeed * this.fallForwardRatio * frameScale),
              (this.fallTime += frameScale),
              (this.y < -120 || this.fallTime > 90) && triggerGameOver());
          else {
            hasStarted &&
              ((this.x += 8 * phoneTilt * frameScale),
                keys.left && (this.x -= 8 * frameScale),
                keys.right && (this.x += 8 * frameScale));
            let e = 120;
            Math.abs(this.x) > e &&
              ((this.falling = !0),
              (this.vy = -1),
              (this.fallTime = 0),
              (this.fallDirection = Math.sign(this.x)));
          }
          let t = this.x - e, a = gameSpeed * frameScale;
          this.jumping && !this.falling &&
            ((this.y += this.vy * frameScale),
            (this.vy -= this.gravity * frameScale),
            this.x >= -120 && this.x <= 120 && this.y <= this.baseY && this.vy <= 0 &&
              ((this.y = this.baseY), (this.jumping = !1), (this.vy = 0)));
          let r = Math.sqrt(t * t + a * a);
          if (r > 0.001) {

        jump() {

      };
      
      player.maxJumpHeight = player.baseY + (player.jumpStrength * player.jumpStrength) / (2 * player.gravity);

      class Obstacle {

          ((this.width = a),
            (this.depth = i),
            (this.height = r),
            (this.isUpsideDown = s),
            (this.y = s ? player.maxJumpHeight : this.height / 2),
            (this.z = t),

        draw() {

            t = Math.max(0, Math.min(1, (this.z - 50) / 100)),
            a = Math.min(e, t);
          pushPyramid(this.x, this.y, this.z, this.width, this.height, this.depth, a, this.isUpsideDown);
        }
        update() {
          this.z -= gameSpeed * frameScale;
        }
      }
      
      class Orb {
        constructor(x, y, z, radius = 14) {

          this.y = y;
          this.z = z;
          this.radius = radius;
          this.collected = false;
          this.spin = Math.random() * Math.PI * 2;
          this.spinSpeed = (0.05 + Math.random() * 0.15) * (Math.random() > 0.5 ? 1 : -1);

        draw() {

          const fadeOutCamera = Math.max(0, Math.min(1, (this.z - 50) / 100));
          const fadeOutDistance = Math.max(0, Math.min(1, (7500 - this.z) / 2000));
          pushOrb(this.x, this.y, this.z, this.radius, this.spin, fadeOutCamera * fadeOutDistance);
        }
        update() {
          this.z -= gameSpeed * frameScale;
          this.spin += this.spinSpeed * frameScale;
        }
      }
      
      function spawnRandomOrb() {
        for (let attempt = 0; attempt < 10; attempt++) {
          const y = Math.random() < 0.55 ? player.baseY : player.maxJumpHeight;
          const x = -110 + Math.random() * 220;
          const z = 6000;
          let valid = true;
          for (const obs of obstacles) {
            if (Math.abs(obs.z - z) < 400 && Math.abs(x - obs.x) < (obs.width / 2 + 25)) {
              valid = false;
              break;
            }
          }
          if (valid) {
            orbs.push(new Orb(x, y, z));
            break;
          }
        }
      }

      function collectOrbs() {
        for (let index = orbs.length - 1; index >= 0; index--) {
          const orb = orbs[index];
          const dx = player.x - orb.x;
          const dy = player.y - orb.y;
          const dz = player.z - orb.z;
          const collisionDistance = player.r + orb.radius;
          if (dx * dx + dy * dy + dz * dz <= collisionDistance * collisionDistance) {
            orb.collected = true;
            orbs.splice(index, 1);
            score++;
            totalOrbs++;
            localStorage.setItem("geometryRunnerTotalCoins", String(totalOrbs));
            orbCounter.textContent = `Orbs: ${score}`;
            player.r = player.baseRadius * 1.5;
          }
        }
      }

      function triggerGameOver() {
        isGameOver ||
          ((isGameOver = !0),
          (gameSpeed = 20),
          (runTime = 0),
          (orbSpawnTimer = 0),
          (player.visible = !1),
          (particles = Array.from({ length: 25 }, () => {
            let e = Math.random() * Math.PI * 2, t = 2 + 5 * Math.random();
            return {
              x: player.x, y: Math.max(player.y, -50), z: player.z,
              vx: Math.cos(e) * t, vy: 5 + 10 * Math.random(), vz: Math.sin(e) * t,
              mat: [1, 0, 0, 0, 1, 0, 0, 0, 1],
              vAx: Math.random() - 0.5, vAy: Math.random() - 0.5, vAz: Math.random() - 0.5,
              vAng: 0.2 * Math.random(), size: 4 + 4 * Math.random(), life: 40 + 20 * Math.random(),
            };
          })),
          submitScoreInBackground(),
          !getSavedCredentials() && score > highscore &&
            ((highscore = score), localStorage.setItem("geometryRunnerHighscore", highscore)),
          (finalScore.textContent = `Score: ${score} | Highscore: ${highscore}`),
          (gameOverText.style.display = "block"),
          (restartTimeout = setTimeout(() => {
            isGameOver && startGame(!0);
          }, 3e3)));
      }

      let activeTouch = !1, lastTouchX = 0, touchStartY = 0;
      function startGame(e = !1) {
        ((score = 0),
          (orbCounter.textContent = `Orbs: ${score}`),
          (gameSpeed = 20),
          (runTime = 0),
          (globalDistance = 0),
          (orbSpawnTimer = 0),
          (isGameOver = !1),
          (obstacles = []),
          (orbs = []),
          (nextTimer = 0),
          (particles = []),
          (keys.left = !1),
          (keys.right = !1),
          (activeTouch = !1),
          (renderQueue = []),
          (player.x = 0),
          (player.y = 15),
          (player.z = 200),
          (player.vy = 0),
          (player.fallTime = 0),
          (player.fallDirection = 0),
          (player.mat = [1, 0, 0, 0, 1, 0, 0, 0, 1]),
          (player.jumping = !1),
          (player.falling = !1),
          (player.visible = !0),
          (hasStarted = !0),
          (startText.style.display = "none"),
          (gameOverText.style.display = "none"),
          restartTimeout && clearTimeout(restartTimeout));
      }
      
      function resetGame() {
        ((hasStarted = !1),
          (score = 0),
          (orbCounter.textContent = `Orbs: ${score}`),
          (gameSpeed = 20),
          (runTime = 0),
          (globalDistance = 0),
          (isGameOver = !1),
          (obstacles = []),
          (orbs = []),
          (nextTimer = 0),
          (particles = []),
          (keys.left = !1),
          (keys.right = !1),
          (activeTouch = !1),
          (renderQueue = []),
          (player.x = 0),
          (player.y = 15),
          (player.z = 200),
          (player.vy = 0),
          (player.fallTime = 0),
          (player.fallDirection = 0),
          (player.mat = [1, 0, 0, 0, 1, 0, 0, 0, 1]),
          (player.jumping = !1),
          (player.falling = !1),
          (player.visible = !0),
          (gameOverText.style.display = "none"),
          (startText.style.display = "block"),
          restartTimeout && clearTimeout(restartTimeout));
      }
      
      function getMountainElevation(x, worldZ) {
        let absX = Math.abs(x);
        let base = 0;
        if (absX > 150) {
            base = Math.pow((absX - 150) / 300, 2) * 50;
        }
        let noiseScale = Math.max(0, Math.min(1, (absX - 100) / 300));
        let noise = (Math.sin(x * 0.004 + worldZ * 0.005) * 60) + (Math.cos(x * 0.008 - worldZ * 0.004) * 40);
        return -60 + base + (noise * noiseScale);
      }
      
      function drawEnvironment() {
        let farProject = project(0, 0, 8e3);
        let horizonY = farProject.y;
        let parallaxShift = farProject.x - 160;

        ctx.fillStyle = "#0a0a0c";
        ctx.fillRect(0, 0, c.width, c.height);

        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < stars.length; i++) {
          let star = stars[i];
          let sx = (star.x * c.width - parallaxShift * 0.25) % c.width;
          if (sx < 0) sx += c.width;
          let sy = star.y * horizonY;
          let twinkle = 0.3 + 0.7 * Math.abs(Math.sin((globalColorTime * 0.05) + star.twinkleOffset));
          ctx.globalAlpha = twinkle;
          ctx.fillRect(sx, sy, 1.5, 1.5);
        }
        ctx.globalAlpha = 1;

        let sunX = 160 - parallaxShift * 0.12;
        ctx.beginPath();
        ctx.arc(sunX, horizonY, 55, 0, Math.PI, true);
        let sunGrad = ctx.createLinearGradient(0, horizonY - 55, 0, horizonY);
        sunGrad.addColorStop(0, `hsla(${baseHue}, 74%, 53%, 0.9)`);
        sunGrad.addColorStop(1, `hsla(${baseHue}, 74%, 53%, 0.0)`);
        ctx.fillStyle = sunGrad;
        ctx.fill();

        let mountZOffset = mountainZTracker % 200;
        let worldMountZBase = Math.floor(mountainZTracker / 200) * 200;

        let t = ctx.createLinearGradient(0, c.height, 0, horizonY - 50);
        t.addColorStop(0, `hsla(${baseHue}, 74%, 53%, 0.9)`);
        t.addColorStop(0.5, `hsla(${baseHue}, 30%, 75%, 0.3)`);
        t.addColorStop(1, `hsla(${baseHue}, 20%, 95%, 0)`);
        ctx.strokeStyle = t;
        ctx.lineWidth = 1.5;
        ctx.lineJoin = "round";

        for (let z = 8000; z >= 200; z -= 200) {
          let actualZ = z - mountZOffset;
          if (actualZ < camera.z + 10) continue;
          let worldZ = worldMountZBase + z;
          let nextActualZ = actualZ - 200;
          let nextWorldZ = worldZ - 200;
          
          let fadeOut = Math.max(0, Math.min(1, (8000 - actualZ) / 1000));
          ctx.globalAlpha = fadeOut;

          for (let x = -4400; x < 4400; x += 200) {
            let nextX = x + 200;
            let y1 = getMountainElevation(x, worldZ);
            let y2 = getMountainElevation(nextX, worldZ);
            let y3 = getMountainElevation(nextX, nextWorldZ);
            let y4 = getMountainElevation(x, nextWorldZ);
            
            let p1 = project(x, y1, actualZ);
            let p2 = project(nextX, y2, actualZ);
            let p3 = project(nextX, y3, nextActualZ);
            let p4 = project(x, y4, nextActualZ);

            if (p1.s > 0 && p2.s > 0 && p3.s > 0 && p4.s > 0) {
              if (p1.y > horizonY || p2.y > horizonY || p3.y > horizonY || p4.y > horizonY) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.lineTo(p3.x, p3.y);
                  ctx.lineTo(p4.x, p4.y);
                  ctx.closePath();
                  ctx.fillStyle = "#0a0a0c";
                  ctx.fill();
                  ctx.stroke();

            }
          }
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#0a0a0c";
        ctx.beginPath();
        let fillStarted = false;
        for (let z = -200; z <= 8000; z += 150) {
          let p = project(-120, 0, z);
          if (!fillStarted) { ctx.moveTo(p.x, p.y); fillStarted = true; }
          else { ctx.lineTo(p.x, p.y); }
        }
        for (let z = 8000; z >= -200; z -= 150) {
          let p = project(120, 0, z);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        gridZ.forEach((zVal, index) => {
          if (!isGameOver) gridZ[index] -= gameSpeed * frameScale;
          if (gridZ[index] < -200) gridZ[index] += 8200;
          if (gridZ[index] > -190) {
            let p1 = project(-120, 0, gridZ[index]);
            let p2 = project(120, 0, gridZ[index]);
            if (p1.s > 0) {
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
            }
          }
        });
        for (let laneX of [-120, -60, 0, 60, 120]) {
          let started = false;
          for (let z = -200; z <= 8000; z += 150) {
            let p = project(laneX, 0, z);
            if (!started) {
                ctx.moveTo(p.x, p.y);
                started = true;
            } else {
                ctx.lineTo(p.x, p.y);
            }
          }
        }
        ctx.stroke();
      }
      
      function animate(e = performance.now()) {
        if (isPageVisible) {
          if (
            ((frameScale = lastFrameTime ? 1 * Math.min((e - lastFrameTime) / frameTime, 2) : 1),
            (lastFrameTime = e))
          ) {
            globalColorTime += (gameSpeed / 20) * frameScale;
            if (!isGameOver) {
                mountainZTracker += (hasStarted ? gameSpeed * 0.25 : 5) * frameScale;
            }
            
            baseHue = (45 + globalColorTime * 0.1) % 360;
            document.documentElement.style.setProperty('--theme-color', `hsl(${baseHue}, 74%, 53%)`);
            document.documentElement.style.setProperty('--theme-glow', `hsla(${baseHue}, 74%, 53%, 0.25)`);
            
            ctx.clearRect(0, 0, c.width, c.height);
            drawEnvironment();
            renderQueue = [];
            
            if (isGameOver) {
                for (let e of obstacles) e.draw();
                for (let e = particles.length - 1; e >= 0; e--) {
                  let t = particles[e];
                  ((t.x += t.vx * frameScale),
                    (t.y += t.vy * frameScale),
                    (t.z += t.vz * frameScale),
                    (t.vy -= player.gravity * frameScale),
                    (t.mat = multMat(getRotMat(t.vAx, t.vAy, t.vAz, t.vAng * frameScale), t.mat)),
                    (t.life -= frameScale),
                    t.life <= 0 ? particles.splice(e, 1) : pushSphere(t.x, t.y, t.z, t.size, t.mat, Math.max(0, t.life / 60)));
                }
            } else {
                globalDistance += gameSpeed * frameScale;
                player.update();
                player.draw();
                
                if (hasStarted) {
                  runTime += frameScale;
                  gameSpeed = Math.min(60, 20 + runTime / 250);
                  if (nextTimer <= 0) {
                    let e = 40 + 40 * Math.random(), t = e, a = Math.random() < 0.8 ? 1 : Math.random() < 0.9 ? 2 : 3,
                      r = Math.random() < 0.2 ? Math.floor(a * Math.random()) : -1, i = 6e3;
                    let highestGroundObs = 0;
                    for (let s = 0; s < a; s++) {
                      let l = 1 === a ? -120 + e / 2 + Math.random() * (240 - e) : -120 + e / 2 + (s * (240 - e)) / (a - 1),
                        o = s === r ? 220 : 40 + 40 * Math.random();
                      obstacles.push(new Obstacle(l, i, e, o, t, !1));
                      if (o > highestGroundObs) highestGroundObs = o;
                    }
                    if (Math.random() < 0.35 && highestGroundObs < 150) {
                      let s = 60, l = -120 + s / 2 + Math.random() * (240 - s);
                      obstacles.push(new Obstacle(l, i, s, 45, s, !0));
                    }
                    nextTimer = 35 + 25 * Math.random();
                  } else nextTimer -= frameScale;
                  
                  orbSpawnTimer -= frameScale;
                  if (orbSpawnTimer <= 0) {
                    spawnRandomOrb();
                    orbSpawnTimer = 45 + Math.random() * 55;
                  }
                }
                
                for (let e = obstacles.length - 1; e >= 0; e--) {
                  let t = obstacles[e];
                  t.update();
                  t.draw();
                  if (hasStarted) {
                      let a = player.x - player.r, r = player.x + player.r, i = player.y - player.r,
                        s = player.y + player.r, l = player.z - player.r, o = player.z + player.r,
                        h = t.x - t.width / 2, n = t.x + t.width / 2, c = t.y - t.height / 2, m = t.y + t.height / 2,
                        y = t.z - t.depth / 2, p = t.z + t.depth / 2;
                      if (!player.falling && a < n && r > h && i < m && s > c && l < p && o > y) triggerGameOver();
                      if (t.z < -200 && (!obstacles.splice(e, 1)[0].isUpsideDown || Math.random() > 0.5));
                  }
                }
                
                for (let e = orbs.length - 1; e >= 0; e--) {
                  const orb = orbs[e];
                  orb.update();
                  if (orb.z < -250) orbs.splice(e, 1);
                  else orb.draw();
                }
                
                if (hasStarted) collectOrbs();
            }
            renderQueue.sort((e, t) => t.cz - e.cz);
            for (let e of renderQueue)
              e.cz > -190 &&
                ("box" === e.type ? drawBox(e) : "pyramid" === e.type ? drawPyramid(e) : "sphere" === e.type ? drawSphere(e) : "orb" === e.type && drawOrb(e));
          }
          requestAnimationFrame(animate);
        }
      }
      (window.addEventListener("keydown", (e) => {
        (("KeyA" !== e.code && "ArrowLeft" !== e.code) || (keys.left = !0),
          ("KeyD" !== e.code && "ArrowRight" !== e.code) || (keys.right = !0),
          ("Space" !== e.code && "ArrowUp" !== e.code) ||
            (!hasStarted || isGameOver ? startGame(!0) : player.jump()));
      }),
        window.addEventListener("keyup", (e) => {
          (("KeyA" !== e.code && "ArrowLeft" !== e.code) || (keys.left = !1),
            ("KeyD" !== e.code && "ArrowRight" !== e.code) || (keys.right = !1));
        }),
        c.addEventListener(
          "touchstart",
          (e) => {
            (e.preventDefault(),
              "undefined" != typeof DeviceOrientationEvent &&
                "function" == typeof DeviceOrientationEvent.requestPermission &&
                DeviceOrientationEvent.requestPermission().catch(() => {}),
              !hasStarted || isGameOver ? startGame(!0) : player.jump());
          },
          { passive: !1 },
        ),
        document.addEventListener("visibilitychange", () => {
          ((isPageVisible = "visible" === document.visibilityState),
            isPageVisible && ((lastFrameTime = 0), requestAnimationFrame(animate)));
        }),
        resetGame(),
        animate());
    </script>
